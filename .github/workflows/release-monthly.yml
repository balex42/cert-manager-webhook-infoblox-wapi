# Modified by the balex42 fork: request a refresh through the normal release process.
name: Monthly Release Refresh

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-release-refresh
  cancel-in-progress: false

jobs:
  request-refresh:
    name: Open Release Refresh PR
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Check Release Automation Token
        env:
          RELEASE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'Configure GH_TOKEN for release PR creation and downstream workflow triggers.'
            exit 1
          fi
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
      - name: Update Monthly Refresh Marker
        run: |
          python3 -c 'from datetime import datetime, timezone; from pathlib import Path; Path(".release-refresh").write_text(datetime.now(timezone.utc).strftime("%Y-%m") + "\n")'
      - name: Open Refresh PR
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}
          branch: chore/monthly-release-refresh
          base: main
          add-paths: .release-refresh
          commit-message: "fix(deps): refresh release artifacts"
          title: "fix(deps): refresh release artifacts"
          body: |
            Requests a patch release through Release Please. After merge, the normal
            release pipeline validates the revision, publishes/signs the image, and
            publishes/signs its digest-pinned OCI chart. Pinned dependency updates
            are handled separately by Dependabot.
