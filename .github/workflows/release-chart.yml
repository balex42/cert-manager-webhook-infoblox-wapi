# Modified by the balex42 fork: native Helm OCI publishing, after the signed image.
name: Release OCI Chart

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      image:
        required: true
        type: string
      image-digest:
        required: true
        type: string
      chart-parent:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Package, Publish, Verify, and Sign Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout Validated Revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Log Into GHCR
        run: |
          # Helm and Cosign share Docker-compatible registry authentication.
          export DOCKER_CONFIG="$RUNNER_TEMP/chart-registry"
          export HELM_REGISTRY_CONFIG="$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          echo "HELM_REGISTRY_CONFIG=$HELM_REGISTRY_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io \
            --username "$REGISTRY_USERNAME" --password-stdin
      - name: Publish and Pull Back Immutable Chart
        id: chart
        env:
          CHART_PARENT: ${{ inputs.chart-parent }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          python3 workflow_scripts/release.py chart \
            --repository "${CHART_PARENT}/cert-manager-webhook-infoblox-wapi" \
            --version "$VERSION" --image "$IMAGE" --digest "$IMAGE_DIGEST"
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      - name: Sign Chart Digest
        env:
          CHART: ${{ steps.chart.outputs.chart }}
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART#oci://}@${DIGEST}"
      - name: Write Release Summary
        env:
          CHART: ${{ steps.chart.outputs.chart }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          IMAGE: ${{ inputs.image }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo '## Published release'
            echo "- Image: \`${IMAGE}@${IMAGE_DIGEST}\`"
            echo "- Chart: \`${CHART}@${CHART_DIGEST}\`"
            echo "- Version: \`${VERSION}\`"
            echo ''
            echo '```sh'
            echo "helm upgrade --install infoblox-webhook ${CHART} --version ${VERSION} --namespace infoblox-webhook --create-namespace --values values-production.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
