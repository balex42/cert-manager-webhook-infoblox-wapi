# Modified by the balex42 fork: chart contract, readiness, and namespace/RBAC checks.
name: Helm

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
  push:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "tests/**"
      - "workflow_scripts/**"
      - ".github/workflows/release*.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "tests/**"
      - "workflow_scripts/**"
      - ".github/workflows/release*.yml"
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

concurrency:
  group: helm-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build a single-arch image to a local OCI tarball and hand it to the test
      # job as a workflow artifact. This keeps the image off the shared ghcr
      # package (no throwaway test-<run_id> tags) while still letting the kind
      # cluster load it via `kind load image-archive`.
      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-test
          outputs: type=docker,dest=/tmp/webhook-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webhook-image
          path: /tmp/webhook-image.tar
          retention-days: 1


  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            127.0.0.1:5000
            api.github.com:443
            get.helm.sh:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Set Up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Chart Deployment Contract
        run: go test -mod=readonly -tags=chart -run TestChartConfiguration .

      - name: Test OCI Publishing and Immutable Retries
        env:
          OCI_TEST_REGISTRY: 127.0.0.1:5000
        run: python3 -m unittest discover -s tests -p 'test_release*.py' -v

      - name: Lint Helm Charts
        run: |
          for chart in charts/*/; do
            echo "Linting $chart"
            helm lint "$chart" --strict --set infoblox.host=infoblox.example.com
          done

      - name: Template Helm Charts
        run: |
          for chart in charts/*/; do
            echo "Templating $chart"
            helm template test "$chart" --set infoblox.host=infoblox.example.com --debug
          done

  test:
    name: Test Helm Charts
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: false
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Set Up Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: kind

      - name: Download Image Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webhook-image
          path: /tmp

      - name: Load Docker Image Into Kind
        run: |
          # Load the OCI tarball built by the `build` job straight into Kind
          # (no registry round-trip, so nothing is pushed to ghcr).
          kind load image-archive /tmp/webhook-image.tar --name kind

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.19.2/cert-manager.yaml
          kubectl wait --for=condition=Available --timeout=300s -n cert-manager deployment/cert-manager
          kubectl wait --for=condition=Available --timeout=300s -n cert-manager deployment/cert-manager-webhook
          kubectl wait --for=condition=Available --timeout=300s -n cert-manager deployment/cert-manager-cainjector

      - name: Test Helm Chart Installation
        env:
          IMAGE_TAG: ci-test
        run: |
          kubectl create namespace webhook-test
          kubectl create secret generic infoblox-credentials -n webhook-test \
            --from-literal='creds.json={"username":"test-user","password":"test-password"}'
          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            echo "Testing installation of $chart_name"
            
            # Startup validates mounts and TLS locally; it does not require a live WAPI.
            helm install "test-$chart_name" "$chart" \
              --create-namespace \
              --namespace webhook-test \
              --set groupName=acme.example.com \
              --set image.repository=ghcr.io/${{ github.repository }} \
              --set image.tag=${IMAGE_TAG} \
              --set image.pullPolicy=IfNotPresent \
              --set infoblox.host=infoblox.example.com \
              --timeout 5m \
              --debug
            
            # Wait for certificates to be issued by cert-manager
            echo "Waiting for certificates to be ready..."
            kubectl wait --for=condition=Ready certificate --all -n webhook-test --timeout=3m
            kubectl rollout status deployment/cert-manager-webhook-infoblox-wapi -n webhook-test --timeout=3m
            kubectl wait --for=condition=Available apiservice/v1alpha1.acme.example.com --timeout=3m
            
            # Verify resources were created
            echo "Verifying Kubernetes resources..."
            kubectl get all,certificate,issuer,secret -n webhook-test
            
            # Mounted credentials must not imply Kubernetes Secret-reading privileges,
            # including for application namespaces distinct from the webhook namespace.
            for namespace in webhook-test application-a application-b; do
              if [ "$namespace" != webhook-test ]; then
                kubectl create namespace "$namespace"
              fi
              if kubectl auth can-i get secrets/infoblox-credentials -n "$namespace" \
                --as=system:serviceaccount:webhook-test:cert-manager-webhook-infoblox-wapi; then
                echo "Unexpected Secret-reading permission in $namespace"
                exit 1
              fi
            done
            helm test "test-$chart_name" -n webhook-test --timeout=2m
            
            # Cleanup for next chart
            helm uninstall "test-$chart_name" -n webhook-test
          done
