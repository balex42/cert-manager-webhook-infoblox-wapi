# Modified by the balex42 fork for shared credentials and verified WAPI TLS.
# cspell:ignore mycompany
# The GroupName here is used to identify your company or business unit that
# created this webhook.
# For example, this may be "acme.mycompany.com".
# This name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
# This group name should be **unique**, hence using your own company's domain
# here is recommended.
groupName: acme.mycompany.com
replicaCount: 1

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

rootCACertificate:
  duration: "43800h"
servingCertificate:
  duration: "8760h"

image:
  repository: ghcr.io/balex42/cert-manager-webhook-infoblox-wapi
  # Override the image tag whose default is the chart appVersion.
  tag: ""
  # When set, digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# Optionally specify image pull secrets for private registries
imagePullSecrets: []
# - name: my-registry-secret

nameOverride: ""
fullnameOverride: ""

# Annotations to add to the pod
podAnnotations: {}

# Pod-level security context.
# On OpenShift, the platform assigns a random UID from the namespace's UID range, so you
# should remove runAsUser/runAsGroup/fsGroup (or set them to null) and omit seccompProfile.
# Example for OpenShift (minimal, lets OpenShift assign UID):
#   podSecurityContext:
#     runAsNonRoot: true
#     runAsUser: null
#     runAsGroup: null
#     fsGroup: null
#     seccompProfile: null
# To disable the pod security context entirely, set it to null:
#   podSecurityContext: null
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context.
# The default settings are compatible with OpenShift's built-in restricted-v2 SCC
# and do not normally need to be changed.
# To disable the container security context entirely, set it to null:
#   containerSecurityContext: null
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Shared-account settings are controlled by the deployment, never by an Issuer.
infoblox:
  host: "" # Required: WAPI hostname (without scheme, port, or path).
  port: 443
  version: "2.10"
  httpRequestTimeout: 60
  httpPoolConnections: 10
  credentials:
    existingSecret: infoblox-credentials
    key: creds.json
  tls:
    verify: true
    caBundle:
      # Optional PEM bundle added to system trust. Must be in the release namespace.
      existingConfigMap: ""
      key: ca.crt

securePort: 8443

service:
  type: ClusterIP
  # Service port; the non-privileged container listener uses securePort.
  port: 443
  # Annotations to add to the service
  annotations: {}

# Resource limits and requests for the webhook container
# We recommend setting these for production deployments
resources:
  {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 50m
  #   memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Topology spread constraints for pod distribution across zones/nodes
# https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels:
#       app: cert-manager-webhook-infoblox-wapi

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  enabled: false
  # namespace: monitoring
  # interval: 30s
  # scrapeTimeout: 10s
  # additionalLabels: {}

# NetworkPolicy to restrict egress traffic
networkPolicy:
  enabled: false
  # Required when enabled: control-plane peers that connect to the aggregated API.
  # Use ipBlock entries for host-network/external API servers as appropriate for your CNI.
  ingressPeers: []
  dnsPeers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  # Required when enabled: explicit rules for WAPI and Kubernetes API endpoints.
  egressRules: []
  # egressRules:
  #   - to:
  #       - ipBlock:
  #           cidr: 10.0.0.0/8  # Your Infoblox server CIDR
  #     ports:
  #       - protocol: TCP
  #         port: 443
