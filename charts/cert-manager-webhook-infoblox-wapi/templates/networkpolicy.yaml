{{- if .Values.networkPolicy.enabled }}
{{- if or (empty .Values.networkPolicy.ingressPeers) (empty .Values.networkPolicy.egressRules) }}
{{- fail "networkPolicy requires ingressPeers for API servers and egressRules for Kubernetes API and WAPI endpoints" }}
{{- end }}
# Modified by the balex42 fork: explicit control-plane and WAPI peers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "webhook.name" . }}
    chart: {{ include "webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "webhook.name" . }}
      release: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.securePort }}
  egress:
    {{- with .Values.networkPolicy.dnsPeers }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- toYaml .Values.networkPolicy.egressRules | nindent 4 }}
{{- end }}
