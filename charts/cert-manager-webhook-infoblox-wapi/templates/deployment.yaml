{{- if and .Values.infoblox.tls.caBundle.existingConfigMap (not .Values.infoblox.tls.verify) }}
{{- fail "infoblox.tls.caBundle requires infoblox.tls.verify=true" }}
{{- end }}
# Modified by the balex42 fork: shared Secret and CA mounts, non-root listener.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "webhook.name" . }}
    chart: {{ include "webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "webhook.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "webhook.name" . }}
        release: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "webhook.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port={{ .Values.securePort }}
          env:
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            - name: INFOBLOX_HOST
              value: {{ required "infoblox.host is required" .Values.infoblox.host | quote }}
            - name: INFOBLOX_PORT
              value: {{ .Values.infoblox.port | quote }}
            - name: INFOBLOX_VERSION
              value: {{ .Values.infoblox.version | quote }}
            - name: INFOBLOX_HTTP_TIMEOUT
              value: {{ .Values.infoblox.httpRequestTimeout | quote }}
            - name: INFOBLOX_HTTP_POOL_CONNECTIONS
              value: {{ .Values.infoblox.httpPoolConnections | quote }}
            - name: INFOBLOX_TLS_VERIFY
              value: {{ .Values.infoblox.tls.verify | quote }}
            {{- if .Values.infoblox.tls.caBundle.existingConfigMap }}
            - name: INFOBLOX_CA_FILE
              value: /etc/infoblox-ca/ca.crt
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.securePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
            - name: credentials
              mountPath: /etc/secrets
              readOnly: true
            {{- if .Values.infoblox.tls.caBundle.existingConfigMap }}
            - name: infoblox-ca
              mountPath: /etc/infoblox-ca
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.infoblox.credentials.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.infoblox.credentials.key | quote }}
                path: creds.json
        {{- if .Values.infoblox.tls.caBundle.existingConfigMap }}
        - name: infoblox-ca
          configMap:
            name: {{ .Values.infoblox.tls.caBundle.existingConfigMap | quote }}
            items:
              - key: {{ .Values.infoblox.tls.caBundle.key | quote }}
                path: ca.crt
        {{- end }}
        - name: certs
          secret:
            secretName: {{ include "webhook.servingCertificate" . }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
    {{- end }}
