# Non-secret rendering fixture; addresses are documentation-only examples.
infoblox:
  host: infoblox.example.com
  credentials:
    existingSecret: shared-credentials
    key: account.json
  tls:
    caBundle:
      existingConfigMap: enterprise-ca
      key: roots.pem
image:
  digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
networkPolicy:
  enabled: true
  ingressPeers:
    - ipBlock:
        cidr: 192.0.2.10/32
  egressRules:
    - to:
        - ipBlock:
            cidr: 192.0.2.20/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.0.2.10/32
      ports:
        - port: 6443
          protocol: TCP
